name: Validar y publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  native-live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador para la prueba de directo
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Probar cámara y espectadores mediante el SFU real
        env:
          CAMPUS_NATIVE_QA_URL: http://127.0.0.1:3000/
        run: |
          node tools/serve.mjs --port 3000 > /tmp/campus-native-ui.log 2>&1 &
          campus_native_ui_pid=$!
          trap 'kill "$campus_native_ui_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 0.25
          done
          npm run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-directos-nativos
          path: |
            tests/screenshots/native-live-*.png
            work/qa-native-live-report.json
          retention-days: 14
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Preparar archivos estáticos
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r css js data assets vendor _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: [build, native-live-check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

  verify-published:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas de comprobación
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          python -m pip install Pillow numpy
      - name: Descargar fuente para comparar píxeles
        run: |
          mkdir -p work/source-research
          python - <<'PYCODE'
          import json,urllib.request,pathlib
          info=json.loads(pathlib.Path('assets/mapa-campus-base.json').read_text())
          urllib.request.urlretrieve(info['source']['url'],'work/source-research/mapa-chatbot.png')
          PYCODE
      - name: Probar la página publicada y tomar capturas
        env:
          CAMPUS_QA_URL: https://dmgproyectos01.github.io/MAPA-DEL-TECNOLOGICO/
        run: |
          node tests/browser.mjs
          node tests/events-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-pagina-publicada
          path: |
            tests/screenshots/raster-*.png
            tests/screenshots/events-*.png
            work/qa-raster-report.json
            work/qa-events-report.json
          retention-days: 14
